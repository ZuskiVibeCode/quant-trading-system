# Cold/active rotation tunables (paper research only; never colds holdings)
rotation:
  lookback_cycles: 10
  min_median_confidence: 35.0
  max_long_fraction: 0.35
  cold_days: 15
  max_new_cold_per_theme_per_cycle: 1
  active_target_per_theme: 10
