      - AMZN
      - META
      - ORCL
      - ACN
      - CRWD
  space:
    active:
      - RKLB
      - ASTS
      - LUNR
      - BA
      - LHX
      - RDW
      - BKSY
      - IRDM
      - NOC
      - LMT
