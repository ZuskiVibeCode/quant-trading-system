# Active set is researched each cycle (~10/theme). Bench names promote when
# an active name goes cold. See README "Cold / active researcher".
themes:
  quantum:
    active:
      - IONQ
      - RGTI
      - QUBT
      - IBM
      - GOOGL
      - QBTS
      - QSI
      - MSFT
      - AMD
      - HON
