starting_equity: 100.0
paper_mode: true

# Hard risk limits (enforced in PortfolioManager + ExecutionAgent)
max_position_pct: 0.20          # 20% of equity per position
max_daily_loss_pct: 0.10        # 10% daily loss -> halt day
max_drawdown_pct: 0.15          # 15% drawdown -> halt + alert

# Agent weighting policy (OOS only; no in-sample reweight)
initial_weight: equal
weight_floor: 0.05              # 5%
weight_cap: 0.40                # 40%
review_30d: equal_only          # review only, keep equal
review_90d: light_sharpe        # light Sharpe-based weights
review_1y: fuller_sharpe        # fuller Sharpe weighting

# Execution
allow_short: false              # paper long-biased for small account
min_confidence_to_trade: 55     # buy / open floor
min_confidence_to_sell: 40      # easier exits / reduces
min_order_notional: 1.0         # dollars

# Cash buffer trim (when flat broke: sell weakest score<=0 holding)
cash_buffer_min_pct: 0.10       # trigger when cash/equity below this
cash_buffer_target_pct: 0.15    # documented target; trim uses min + frac
buffer_trim_frac: 0.20          # sell this fraction of weakest holding
max_buffer_trims_per_cycle: 1   # at most one buffer trim ticket per cycle
