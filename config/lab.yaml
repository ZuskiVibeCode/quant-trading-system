# Strategy lab settings (see docs/harness-upgrade-design.md). Paper research only.
data:
  # Alpaca daily bars start here.
  start: "2016-01-01"
  # Hard ceiling for bars on this machine. Grok's shared machine keeps discovery
  # data only (through 2021-12-31). The validation/holdout machine raises it with
  # QUANT_LAB_DATA_CEILING (an ISO date or "today").
  ceiling: "2021-12-31"
  # SIP = full-market volume (IEX is a small slice and would mis-bucket liquidity).
  feed: sip
  # Split + dividend adjusted.
  adjustment: all
benchmark: SPY
# Fill model: signal at day t's close, fill at day t+1's open. Slippage per side
# by the 20-day median dollar volume as of day t (Alpaca charges no commission).
# Highest matching bucket wins; below the lowest bucket a name is not tradable.
costs:
  lookback_days: 20
  buckets:
    - {min_dollar_volume: 50000000, bps: 5}
    - {min_dollar_volume: 10000000, bps: 15}
    - {min_dollar_volume: 2000000, bps: 30}
# Robustness (`lab robust`, gauntlet step 2). Starting thresholds; every report
# records the values it used.
robust:
  # Each setting moved by these fractions, one at a time, within the spec's own min/max.
  nudges: [-0.2, -0.1, 0.1, 0.2]
  # Share of nudged variants that must still beat SPY and equal-weight.
  nudge_pass_share: 0.75
  # Median nudged Sharpe must be at least this fraction of the spec's Sharpe (no sharp peak).
  peak_ratio: 0.5
  # Sector / cap-bucket subsets with fewer names are skipped.
  min_subset_names: 10
  # A subset counts as a pass when the rerun's average daily return beats that
  # subset's equal-weight held at the strategy's own invested fraction each day
  # (exposure-matched), with at least this many entries. A subset with fewer
  # entries counts as a miss; it stays in the denominator.
  min_subset_entries: 30
  # Share of sectors / cap buckets that must pass (0.6: 7 of 11 sectors, 2 of 3 caps).
  sector_pass_share: 0.6
  cap_pass_share: 0.6
  # Selloffs inside discovery: the strategy's worst drawdown in each may be at most
  # selloff_dd_ratio x the worse of SPY's and equal-weight's.
  selloffs:
    - {name: q4_2018, start: "2018-10-01", end: "2018-12-31"}
    - {name: covid_2020, start: "2020-02-01", end: "2020-04-30"}
  selloff_dd_ratio: 1.25
# Validation / holdout runs (`lab validate`, `lab holdout`, on the validation machine).
# These breakouts are reported next to the verdict, not part of the pass bar.
locked:
  # Selloffs inside a locked window, flagged with robust.selloff_dd_ratio.
  selloffs:
    - {name: bear_2022, start: "2022-01-03", end: "2022-10-31"}
# Broad universe, relative to config/. Built by scripts/build_lab_universe.py.
universe_file: lab_universe.yaml
