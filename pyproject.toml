[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-trading-system"
version = "0.1.0"
description = "Multi-agent paper quant trading system for quantum/space/robotics themes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "yfinance>=0.2.40",
  "pyyaml>=6.0",
  "pandas>=2.0",
  "numpy>=1.26",
  "alpaca-py>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
quant-system = "quant_system.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quant_system*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
